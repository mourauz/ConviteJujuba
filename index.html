<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Convite para Jujuba</title>
</head>

<body>

    <div class="container">

        <h1 class="header_text">
            A senhorita, de cabelo ruivo, que parece uma princesa!<br>
            Aceitaria sair com esse belíssimo homem (eu)???
        </h1>

        <div class="gif_container">
            <img src="imagens/eu1.jpeg" alt="Cachorrinho">
        </div>

        <div class="buttons">

            <button class="btn" id="yesButton" onclick="nextPage()">
                Simmmm ❤️
            </button>

            <button class="btn" id="noButton">
                Nãoooooo? 😭
            </button>

        </div>

    </div>

    <script>
        function nextPage() {
            window.location.href = "sim.html";
        }

        const noButton = document.getElementById("noButton");

        function moveButton() {
            const buttonWidth = noButton.offsetWidth;
            const buttonHeight = noButton.offsetHeight;

            const maxX = window.innerWidth - buttonWidth - 20;
            const maxY = window.innerHeight - buttonHeight - 20;

            const x = Math.max(10, Math.random() * maxX);
            const y = Math.max(10, Math.random() * maxY);

            noButton.style.position = "fixed";
            noButton.style.left = `${x}px`;
            noButton.style.top = `${y}px`;
            noButton.style.margin = "0";
        }

        noButton.addEventListener("mouseenter", moveButton);

        noButton.addEventListener("touchstart", function(event) {
            event.preventDefault();
            moveButton();
        });

        noButton.addEventListener("pointerdown", function(event) {
            if (event.pointerType === "touch") {
                event.preventDefault();
                moveButton();
            }
        });
    </script>

</body>

</html>
