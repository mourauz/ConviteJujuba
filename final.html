<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para você </title>

    <link rel="stylesheet" href="final.css">
</head>

<body>

    <audio id="musica" autoplay loop playsinline>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <div id="emojis"></div>

    <main class="pagina">

        <div class="card">

            <h1>Perfeito </h1>

            <img
                src="monkeygira.jpg"
                alt="Nós"
                class="foto"
            >

            <p class="mensagem">
                Agora é só esperar chegar o sábado...
            </p>

            <p class="final">
                Estou com tanta saudade de sentir o seu cheiro e principalmente de você, meu deus...
            </p>

        </div>

    </main>

    <script>

        const musica = document.getElementById("musica");

        musica.volume = 0.6;

        if (sessionStorage.getItem("tocarMusica") === "true") {

            sessionStorage.removeItem("tocarMusica");

            musica.play().catch(() => {

                document.addEventListener("touchstart", function iniciarMusica() {

                    musica.play().catch(() => {});

                    document.removeEventListener("touchstart", iniciarMusica);

                }, { once: true });

            });

        }

        const emojisContainer = document.getElementById("emojis");

        const emojis = [
            "❤️",
            "💕",
            "💗",
            "💖",
            "💘",
            "🌹",
            "✨",
            "🥰"
        ];

        function criarEmoji() {

            const emoji = document.createElement("span");

            emoji.className = "emoji";

            emoji.textContent =
                emojis[Math.floor(Math.random() * emojis.length)];

            emoji.style.left = Math.random() * 100 + "%";

            emoji.style.fontSize =
                (Math.random() * 12 + 16) + "px";

            emoji.style.animationDuration =
                (Math.random() * 3 + 5) + "s";

            emojisContainer.appendChild(emoji);

            setTimeout(() => {
                emoji.remove();
            }, 8000);
        }

        setInterval(criarEmoji, 500);

    </script>

</body>

</html>
