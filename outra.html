<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="outra.css">
    <title>Outra Escolha </title>
</head>
<body>
    <div class="form-container">
        <div class="titulo">
            <div>🧡</div>
            <h1>Onde vossa majestade quer ir hoje?</h1>
        </div>
        <form id="formulario">
            <input type="hidden" name="tipo" value="Outra coisa">
            <label for="lugar">📍 Qual lugar você gostaria de ir?</label>
            <input
                type="text"
                id="lugar"
                name="lugar"
                placeholder="Qualquer coisa que a senhorita queira fazer"
                required
            >
            <label for="horario">🕐 Qual horário?</label>
            <input
                type="time"
                id="horario"
                name="horario"
                required
            >
            <label for="maps">🗺️ Link do Google Maps (OPCIONAL)</label>
            <input
                type="url"
                id="maps"
                name="google_maps"
                placeholder="Se quiser colocar um link do lugar que escolheu"
            >
            <label for="observacao">💭 Quer deixar alguma observação?</label>
            <textarea
                id="observacao"
                name="observacao"
                placeholder="Se tiver algo a mais para colocar, é aqui..."></textarea>
            <button type="submit">
                Mandar sua escolha
            </button>
        </form>
        <div id="mensagem"></div>
    </div>
    <script src="outra.js"></script>
</body>
</html>
