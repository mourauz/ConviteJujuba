<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="sim_style.css">
    <title>Opções</title>
</head>

<body>

    <div class="container">

        <p class="header_text">
            🧡🧡🧡🧡🧡🧡🧡🧡
            <br><br>
            fico até bobo com essa escolha...
        </p>

        <p class="text">
            Qual lugar te chama mais atenção? 
        </p>
        <p class="segunda-frase">(Lembrando que essas opções eu escolhi com meu pouco conhecimento dai)</p>

    </div>

    <div id="lugar">

        <div id="botoes">

            <button class="btn" onclick="piz()" data-tipo="Pizzaria">
                <img src="imagens/pizza.jpg" alt="Pizza">
                <span>🍕 Pizzaria</span>
            </button>

            <button class="btn" onclick="bar()" data-tipo="Barzinho">
                <img src="imagens/bar.jpg" alt="Barzinho">
                <span>🍺 Barzinho no """"centro""""</span>
            </button>

            <button class="btn" onclick="casa()" data-tipo="Casa">
                <img src="imagens/casa.jpg" alt="Casa">
                <span>🏠 Ir pra casa, e eu cozinho algo para você enquanto a gente bebe algo</span>
                <p class="frase-romantica">PRA MIM A MELHOR OPÇÃO ❤️</p>
            </button>

            <button class="btn" onclick="outra()" data-tipo="Outra coisa">
                <span>OUTRA COISA... FICA A SEU CRITÉRIO</span>
            </button>

        </div>

    </div>

    <script src="sim.js"></script>

</body>

</html>
