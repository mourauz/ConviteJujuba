<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="outra.css">
    <title>Então você escolhe</title>
</head>

<body>

    <div class="form-container">

        <div class="titulo">
            <div>🍊🍊</div>
            <h1>Já que você escolheu...</h1>
            <p>Quero saber onde você gostaria de ir!</p>
        </div>

        <form id="formulario">

            <label for="lugar">📍 Qual lugar você gostaria de ir?</label>

            <input
                type="text"
                id="lugar"
                name="lugar"
                placeholder="Pode ser um restaurante, bar, um samba..."
                required
            >

            <label for="horario">🕐 Que horário?</label>

            <input
                type="time"
                id="horario"
                name="horario"
                required
            >

            <label for="maps">🗺️ Google Maps</label>

            <input
                type="url"
                id="maps"
                name="maps"
                placeholder="Cole o link do Google Maps (opcional)"
            >

            <label for="observacao">💭 Quer deixar alguma observação?</label>

            <textarea
                id="observacao"
                name="observacao"
                placeholder="Se quiser, pode me contar mais alguma coisa..."
            ></textarea>

            <button type="submit">
                ENVIAR SUA ESCOLHA 
            </button>

        </form>

        <div id="mensagem"></div>

    </div>

    <script src="outra.js"></script>

</body>

</html>
