<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Um convite para a Jujuba</title>
</head>

<body>

    <div class="container">

        <h1 class="header_text">
            A senhorita, de cabelo ruivo,<br>
            que parece uma princesa! <br>
            Aceitaria sair com esse belíssimo homem (eu)?
        </h1>

        <div class="gif_container">
            <img src="imagens/dog.jpg" alt="Cachorrinho fofo">
        </div>

        <div class="buttons">
            <button class="btn" id="yesButton" onclick="nextPage()">
                Simmmm 
            </button>

            <button class="btn" id="noButton" onmouseover="moveButton()">
                Nãoooooo?
            </button>
        </div>

    </div>

    <script>
        function nextPage() {
            window.location.href = "sim.html";
        }

        function moveButton() {
            const button = document.getElementById("noButton");

            const maxX = window.innerWidth - button.offsetWidth - 20;
            const maxY = window.innerHeight - button.offsetHeight - 20;

            const x = Math.max(10, Math.random() * maxX);
            const y = Math.max(10, Math.random() * maxY);

            button.style.left = `${x}px`;
            button.style.top = `${y}px`;
        }
    </script>

</body>

</html>
